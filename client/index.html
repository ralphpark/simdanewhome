<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>simda - 식물과 함께하는 더 나은 공간</title>
    <meta name="description" content="simda는 AI 큐레이션, 식물 구독 관리, 교육 서비스를 제공하는 프리미엄 식물 브랜드입니다. 당신의 공간에 완벽한 식물을 찾아보세요." />
    <meta property="og:title" content="simda - 식물과 함께하는 더 나은 공간" />
    <meta property="og:description" content="AI 큐레이션과 전문가 관리 서비스로 당신의 공간에 생명을 불어넣습니다" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var w = window;
        if (w.ChannelIO) {
          return w.console.error("ChannelIO script included twice.");
        }
        var ch = function() {
          ch.c(arguments);
        };
        ch.q = [];
        ch.c = function(args) {
          ch.q.push(args);
        };
        w.ChannelIO = ch;
        function l() {
          if (w.ChannelIOInitialized) {
            return;
          }
          w.ChannelIOInitialized = true;
          var s = document.createElement("script");
          s.type = "text/javascript";
          s.async = true;
          s.src = "https://cdn.channel.io/plugin/ch-plugin-web.js";
          var x = document.getElementsByTagName("script")[0];
          if (x.parentNode) {
            x.parentNode.insertBefore(s, x);
          }
        }
        if (document.readyState === "complete") {
          l();
        } else {
          w.addEventListener("DOMContentLoaded", l);
          w.addEventListener("load", l);
        }
      })();
      
      ChannelIO('boot', {
        "pluginKey": "65f19b46-f43c-443d-9caa-2d54021fdcc1",
        "customLauncherSelector": ".channeltalk-launcher",
        "hideChannelButtonOnBoot": false,
        "language": "ko"
      });
    </script>
  </body>
</html>
